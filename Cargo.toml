[workspace]
members = ["crates/*"]
resolver = "2"
default-members = ["crates/sunbot"]

[workspace.dependencies]
toml = "1.1.8"
once_cell = "1.21.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
sysinfo = "0.39.6"
humantime = "2.2.0"
regex = "1.11.2"
lazy_static = "1.5.0"
rand = "0.10.3"
sentry = "0.49.3"
sentry-tracing = "0.49.3"
async-openai = { version = "0.42.1", features = ["chat-completion", "image"] }
serde_json = "1.0.143"
futures = "0.3.31"
base64 = "0.23.1"
chrono = "0.4.41"
thiserror = "2.0.21"

[workspace.dependencies.tokio]
version = "1.47.1"
features = ["macros", "rt-multi-thread"]

[workspace.dependencies.serde]
version = "1.0.219"
features = ["derive"]

[workspace.dependencies.serenity]
version = "0.12.4"
default-features = false
features = ["default_native_tls", "voice", "chrono"]

[workspace.dependencies.poise]
version = "0.7.0"
default-features = false
features = ["cache", "chrono"]
# handle_panics

[workspace.dependencies.songbird]
version = "0.6.0"
default-features = false
features = ["gateway", "serenity", "native"]

[workspace.dependencies.lavalink-rs]
version = "0.15.0"
default-features = false
features = ["songbird", "serenity", "tungstenite-native-tls", "macros"]

[workspace.dependencies.sea-orm]
version = "2.0.4"
features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
    "macros",
]
